name: mymangaonline

services:
  api:
    image: "${API_IMAGE_NAME:-mymangaonline-api}:${IMAGE_TAG:-local}"
    build:
      context: ../API_Mymangaonline
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGIN: "${WEB_ORIGIN:?Define WEB_ORIGIN in .env.compose}"
      TRUST_PROXY: "${TRUST_PROXY:-loopback, linklocal, uniquelocal}"
      INCLUDE_ERROR_STACKS: "false"
      MANGADEX_ENABLED: "${MANGADEX_ENABLED:-true}"
      COMICK_ENABLED: "${COMICK_ENABLED:-true}"
      INMANGA_ENABLED: "false"
      LEERMANGA_ENABLED: "false"
      TUMANGAONLINE_ENABLED: "false"
      MANGA_SCRAPER_ENABLED: "false"
      MANGPI_ENABLED: "false"
      MYMANGAONLINE_PROVIDER_ENABLED: "false"
      INMANGA_PROVIDER_ENABLED: "false"
      LEERMANGA_PROVIDER_ENABLED: "false"
      TUMANGAONLINE_PROVIDER_ENABLED: "false"
      TRANSLATION_ENABLED: "${TRANSLATION_ENABLED:-false}"
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: "${WEB_IMAGE_NAME:-mymangaonline-web}:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_MYMANGA_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        restart: true
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
