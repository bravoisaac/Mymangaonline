name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node --check scripts/smoke-deployment.mjs
      - run: npm run export:web
        env:
          EXPO_PUBLIC_MYMANGA_API_URL: https://api.example.invalid/api
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build --build-arg EXPO_PUBLIC_MYMANGA_API_URL=https://api.example.invalid/api -t mymangaonline-web:ci .
